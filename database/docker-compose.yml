services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: industrial_timescaledb

    environment:
      POSTGRES_USER: industrial
      POSTGRES_PASSWORD: industrial
      POSTGRES_DB: factory

    ports:
      - "5433:5432"

    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data: